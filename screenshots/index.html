<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowline App Store Screenshots</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #6b6b80;
            font-size: 14px;
        }

        .platform-section {
            margin-bottom: 80px;
        }

        .platform-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
            color: #e8e8f0;
            padding-bottom: 12px;
            border-bottom: 1px solid #16161f;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .screenshot-wrapper {
            position: relative;
        }

        canvas {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.15);
            background: #111118;
        }

        .screenshot-label {
            margin-top: 12px;
            font-size: 13px;
            color: #6b6b80;
            text-align: center;
        }

        .download-section {
            text-align: center;
            margin-bottom: 60px;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 6px;
        }

        .download-btn:hover {
            background: #60a5fa;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .secondary {
            background: #111118;
            border: 1px solid #16161f;
            color: #3b82f6;
        }

        .secondary:hover {
            background: #16161f;
        }

        footer {
            text-align: center;
            color: #3a3a4a;
            font-size: 12px;
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #16161f;
        }

        .dimension-info {
            font-size: 11px;
            color: #3a3a4a;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Flowline Screenshots</h1>
            <p class="subtitle">Professional App Store mockups for iOS and macOS</p>
        </header>

        <!-- iOS Section -->
        <div class="platform-section">
            <div class="platform-title">📱 iPhone (6.1" - 1170 x 2532px)</div>
            <div class="gallery" id="ios-gallery"></div>
            <div class="download-section">
                <button class="download-btn" onclick="downloadAllIOS()">↓ Download All iOS (ZIP)</button>
                <button class="download-btn secondary" onclick="downloadAllIOSPNG()">↓ Download Individual PNGs</button>
            </div>
        </div>

        <!-- macOS Section -->
        <div class="platform-section">
            <div class="platform-title">🖥 macOS (1440 x 900px)</div>
            <div class="gallery" id="macos-gallery"></div>
            <div class="download-section">
                <button class="download-btn" onclick="downloadAllMacOS()">↓ Download All macOS (ZIP)</button>
                <button class="download-btn secondary" onclick="downloadAllMacOSPNG()">↓ Download Individual PNGs</button>
            </div>
        </div>

        <footer>
            <p>Generated for App Store submission • Ready to use • Professional aesthetic</p>
        </footer>
    </div>

    <script src="screenshot-generator.js"></script>
</body>
</html>
