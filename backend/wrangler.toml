name = "claude-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# ── D1 Database ────────────────────────────────────────────────────────────
# Step 1: wrangler d1 create flowline-db
# Step 2: paste the database_id from the output below
[[d1_databases]]
binding       = "DB"
database_name = "flowline-db"
database_id   = "4e042d5c-1432-48cb-98ed-398d3845a78e"

# ── KV Namespace (rate limiting) ───────────────────────────────────────────
# Step 1: wrangler kv namespace create RATE_KV
# Step 2: paste the id from the output below
[[kv_namespaces]]
binding = "RATE_KV"
id      = "d98f04b5d5ef4d7e84d298226b38ec04"

# ── Secrets (set via CLI, never hardcode here) ─────────────────────────────
# wrangler secret put APP_SECRET      → same value as Config.swift appSecret
# wrangler secret put JWT_SECRET      → any long random string (32+ chars) fZXbTEFUTMEfZhbBJvJZuilCMSQGec
# wrangler secret put CLAUDE_API_KEY  → your Anthropic API key
